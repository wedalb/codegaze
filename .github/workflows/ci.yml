name: Build and test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  web-and-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node --test tests/*.test.mjs
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: xvfb-run -a ./gradlew :plugin:test :plugin:buildPlugin :plugin:verifyPluginStructure --no-daemon -Djava.awt.headless=false
      - uses: actions/upload-artifact@v4
        with:
          name: intellij-plugin
          path: plugin/build/distributions/*.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: plugin-test-reports
          path: plugin/build/reports/tests/
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.4.1
        run: bash tools/install_godot_ci.sh
      - name: Import and test native client
        run: |
          godot --headless --xr-mode off --path native --editor --import --quit
          godot --headless --xr-mode off --path native --script test_tracking.gd
          godot --headless --xr-mode off --path native --quit-after 5
      - name: Export native clients
        run: |
          bash tools/install_godot_ci.sh templates
          mkdir -p release/windows release/linux release/macos
          godot --headless --xr-mode off --path native --export-release Windows ../release/windows/CodeGaze.exe
          godot --headless --xr-mode off --path native --export-release Linux ../release/linux/CodeGaze.x86_64
          godot --headless --xr-mode off --path native --export-release macOS ../release/macos/CodeGaze.zip
          cp LICENSE THIRD_PARTY_NOTICES.md release/windows/
          cp LICENSE THIRD_PARTY_NOTICES.md release/linux/
          cd release/windows && zip -r ../CodeGaze-Windows-x86_64.zip .
          cd ../linux && zip -r ../CodeGaze-Linux-x86_64.zip .
          cd ../macos && mv CodeGaze.zip ../CodeGaze-macOS-universal.zip
      - uses: actions/upload-artifact@v4
        with:
          name: native-clients
          path: release/*.zip
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [web-and-data, plugin, native]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: intellij-plugin
          path: release
      - uses: actions/download-artifact@v4
        with:
          name: native-clients
          path: release
      - name: Package source and checksums
        run: |
          git archive --format=zip --prefix=codegaze/ --output=release/CodeGaze-source.zip HEAD
          cd release
          sha256sum *.zip > SHA256SUMS.txt
      - name: Publish research preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --verify-tag --prerelease --title "CodeGaze $GITHUB_REF_NAME — research preview" --notes-file docs/release-notes.md
